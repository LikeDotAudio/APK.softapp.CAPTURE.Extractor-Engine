[package]
name = "extractor_engine"
version = "0.2.0"
edition = "2021"
# build.rs publishes this crate's source dir to dependents as
# DEP_EXTRACTOR_ENGINE_SRC_DIR (the analyzer hashes it into ANALYZER_VERSION).
links = "extractor_engine"
description = "Shared cutting DSP for the Extractor — region detection, slicing, fades, 16-bit WAV encoding. The single source of truth for native (Tauri) and WASM (web) builds."

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# The .PEAK round-trip test only; not linked into consumers.
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
